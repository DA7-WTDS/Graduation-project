services:
  pipeline:
    build:
      context: ./Pipeline
    image: quantwise-pipeline:latest
    container_name: quantwise-pipeline
    restart: unless-stopped
    env_file:
      - ./Pipeline/.env
    environment:
      - YF_CACHE_DIR=/opt/yf-cache
    ports:
      - "8000:8000"          # .NET FetchDailyPipelineJob calls localhost:8000/api/score
    volumes:
      - yf_cache_pipeline:/opt/yf-cache
    networks:
      - project-network

  postgres:
    image: postgres:18
    container_name: postgres-project
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - project-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: redis-project
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - project-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit-project
    ports:
      - "25:1025"
      - "8080:8025" 
    networks:
      - project-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-project
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5151:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - project-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rabbitmq-project
    ports:
      - "5672:5672" 
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    volumes:
      - ./rabbitmq_data:/var/lib/rabbitmq
    networks:
      - project-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s


  backend:
    build:
      context: ./Backend
    image: quantwise-backend:latest
    container_name: quantwise-backend
    restart: unless-stopped
    # Secrets (Authentication__Key, Recommendations__Ingest/Llm__ApiKey,
    # Finnhub__ApiKey, ...) come from the repo-root .env. The explicit
    # environment: block below overrides the host-oriented values in .env with
    # the in-network service DNS names.
    env_file:
      - ./.env
    environment:
      # Development keeps console logging on so `docker logs` is useful; switch
      # to Production once a log aggregator is wired.
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Database=Host=postgres;Port=5432;Database=project_db;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=admin
      - RabbitMQ__Password=admin
      # Reach the pipeline by its in-network service name, not localhost.
      - Portfolio__Instruments__PipelineBaseUrl=http://pipeline:8000
      - Recommendations__Pipeline__BaseUrl=http://pipeline:8000
    ports:
      - "5099:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      pipeline:
        condition: service_started
    networks:
      - project-network

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  rabbitmq_data:
  yf_cache_pipeline:


networks:
  project-network:
    driver: bridge
