# EGX market — SCAFFOLD ONLY. Disabled until the licensed data adapter lands.
# Flip `enabled: true` only after implementing markets/egx/data.py against the
# MarketDataProvider interface and completing the migration checklist in
# IMPLEMENTATION_PLAN.md § 0.1 (backfill -> universe rules -> train EGX model
# -> enable ingest with market=EGX).
market: egx
enabled: false
provider: null  # awaiting licensed vendor

calendar:
  trading_days: [Sun, Mon, Tue, Wed, Thu]
  timezone: Africa/Cairo

universe:
  # EGX100 ∩ liquidity filter — rules defined ahead of data (IMPL § 1.5).
  index: EGX100
  min_avg_daily_value_traded_egp: 5000000
  min_trading_days_per_quarter: 45

fetch:
  period: 6mo
  interval: 1d

# Data-quality gates (§ 6.2). EGX starts stricter on coverage (thin-liquidity
# names drop out often) and looser on sentiment (no Arabic feed at launch).
quality:
  min_coverage: 0.70
  max_staleness_trading_days: 1
  max_abs_change_pct: 20.0       # EGX has 10-20% daily price limits
  min_feature_coverage: 0.80
  sentiment_required: false
